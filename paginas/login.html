<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Clonagem Enzo</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#0b1220; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:#e6edf7; }
  .cx { width:100%; max-width:360px; background:#111a2e; border:1px solid #223055; border-radius:16px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:#8c9bb8; font-size:13px; margin-bottom:20px; }
  label { display:block; font-size:12px; color:#8c9bb8; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:11px 12px; border-radius:10px; border:1px solid #2a3a63; background:#0b1427; color:#e6edf7; font-size:15px; }
  input:focus { outline:none; border-color:#3b82f6; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  .erro { color:#f87171; font-size:13px; margin-top:12px; min-height:18px; }
</style>
</head>
<body>
<form class="cx" id="f" autocomplete="on">
  <h1>Clonagem Enzo</h1>
  <div class="sub">Entre com o seu usuário e senha.</div>
  <label for="usuario">Usuário</label>
  <input id="usuario" name="username" autocomplete="username" autocapitalize="off" required>
  <label for="senha">Senha</label>
  <input id="senha" name="password" type="password" autocomplete="current-password" required>
  <button id="ok" type="submit">Entrar</button>
  <div class="erro" id="erro"></div>
</form>
<script>
const f = document.getElementById('f'), erro = document.getElementById('erro'), ok = document.getElementById('ok');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
  erro.textContent = ''; ok.disabled = true; ok.textContent = 'Entrando…';
  try {
    const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: document.getElementById('usuario').value, senha: document.getElementById('senha').value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { erro.textContent = j.erro || 'Não consegui entrar.'; return; }
    const volta = new URLSearchParams(location.search).get('volta');
    location.href = volta && volta.startsWith('/') && !volta.startsWith('//') ? volta : '/';
  } catch (err) {
    erro.textContent = 'Sem conexão com o servidor.';
  } finally { ok.disabled = false; ok.textContent = 'Entrar'; }
});
</script>
</body>
</html>
